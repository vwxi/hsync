syntax = "proto3";

package hsync;

import "google/protobuf/timestamp.proto";

// if there is no folder provided then
// the password will be interpreted as the passcode for a new folder
message Auth {
  optional string folder = 1;
  string password = 2;
}

// returned after auth works
message RoomInfo {
  message File {
    string name = 1;
  }

  uint64 id = 1;
  string code = 2;
  repeated File files = 3;
}

message Die {
  optional string reason = 1;
}

message BlockMetadata {
  uint64 start = 1;
  uint64 end = 2;
  optional uint64 namehash = 3;
  uint64 hash = 4;
  // server id belonging to the origin of the manifest
  //
  // only set when server->client
  optional uint64 origin = 5;
  // server->client ignores this, client->server requires this
  optional uint64 cookie = 6;
}

// describes a file.
message FileManifest {
  // this version specifically refers to the latest version (highest number)
  uint64 version = 1;
  string filename = 2;
  uint64 timestamp = 3;
  uint64 size = 4;
  // what final data hash should be after blocks
  optional uint64 hash = 5;
  // no cookie means transfers will come from the main block table
  //
  // server->client ignores this, client->server requires this
  optional uint64 cookie = 6;
  repeated BlockMetadata blocks = 7;
}

// get the manifest for a file
message WhatIs {
  string filename = 1;
}

message Delta {
  enum OpType {
    OP_TYPE_EQUAL_UNSPECIFIED = 0;
    OP_TYPE_MODIFY = 1;
    OP_TYPE_INSERT = 2;
    OP_TYPE_DELETE = 3;
  }

  message Operation {
    OpType op_type = 1;
    uint64 hash = 2;
    uint64 start = 3;
    uint64 end = 4;
  }

  uint64 version = 1;
  uint64 size = 2;
  string filename = 3;
  uint64 origin = 4;
  uint64 cookie = 5;
  uint64 hash = 6;
  repeated Operation ops = 7;
}

// whole (uncompressed) is the only supported data mode at the moment
// but in the future i will add support for compressed data modes
enum DataMode {
  DATA_MODE_WHOLE_UNSPECIFIED = 0;
  DATA_MODE_DELTA = 1;
}

// if no data, is a request for data
// if data, is either a response to a request or lone data transfer (from server)
message Transfer {
  BlockMetadata metadata = 1;
  DataMode mode = 2;
  optional bytes data = 3;
}

message BulkTransfer {
  uint64 version = 1;
  uint64 namehash = 2;
  repeated BlockMetadata blocks = 3;
}

enum FileEvent {
  FILE_EVENT_CREATE_UNSPECIFIED = 0;
  FILE_EVENT_DELETE = 1;
}

// filename field refers to a relative path (i.e. `foo/bar/baz.jpg`).
// if field ends with a slash then it refers to a directory.
//
// file events are always on files. client should handle directories
// accordingly. client should refuse any events with special directory
// names like `~` or `..`
message Event {
  FileEvent event = 1;
  string filename = 2;
}

message SendAgain {
  uint64 namehash = 1;
}

message TransferDone {
  uint64 namehash = 1;
  optional uint64 cookie = 2;
}

// server->client: incoming relay stream from other user
// client->server: outgoing relay request to another user
message RelayOpen {
  uint64 id = 1;
}

// whatever relay is open on this stream, close it.
message RelayClose {}

enum Return {
  RETURN_NONE_UNSPECIFIED = 0;
  RETURN_BLOCK_MISMATCH = 1;
  RETURN_EMPTY_MANIFEST = 2;
  RETURN_FILE_NOT_FOUND = 3;
  RETURN_BLOCK_NOT_FOUND = 4;
  RETURN_TRANSFERS_PENDING = 5;
  RETURN_SIZE_LIMIT = 6;
  RETURN_NO_CHANGE = 7;
}

message Packet {
  Return code = 1;

  // no message is interpreted as a heartbeat
  // the quic framework we are using has a timeout and this is done
  // so the connection does not die
  oneof message {
    Auth auth = 2;
    Die die = 3;
    RoomInfo room_info = 4;
    FileManifest manifest = 5;
    Transfer transfer = 6;
    Event event = 7;
    Delta delta = 8;
    WhatIs whatis = 9;
    SendAgain send_again = 10;
    TransferDone done = 11;

    // p2p operations
    RelayOpen relay_open = 12;
    RelayClose relay_close = 13;
    BulkTransfer bulk_transfer = 14;
  }
}
